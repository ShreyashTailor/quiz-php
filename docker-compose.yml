version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=quizmaster
      - DB_PASSWORD=quizmaster_password
      - DB_NAME=quizmaster
      - APP_URL=http://localhost:8080
    volumes:
      - ./logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=quizmaster
      - MYSQL_USER=quizmaster
      - MYSQL_PASSWORD=quizmaster_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=quizmaster
      - PMA_PASSWORD=quizmaster_password
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data: